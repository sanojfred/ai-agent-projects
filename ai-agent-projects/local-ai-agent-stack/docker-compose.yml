# Runs the router CLI in a container while Ollama stays on the Windows host (uses the GPU directly).
services:
  router:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./:/app:ro
    env_file: .env
    environment:
      OLLAMA_HOST: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    entrypoint: ["python", "llm_router.py"]
    command: ["Say hello in one sentence"]
